upstream ai_toolkit {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Enforces the MAX_UPLOAD_MB the application declares but does not check.
    # Keep the two values in sync; nginx rejects with 413 before the request
    # ever reaches uvicorn.
    client_max_body_size 25m;
    client_body_buffer_size 1m;

    # Image responses are already compressed; re-gzipping them wastes CPU that
    # this 2-core box needs for inference.
    gzip off;

    # Liveness probe — must stay fast and must not inherit the long timeouts
    # below, so monitoring notices a wedged process quickly.
    location = /health {
        proxy_pass http://ai_toolkit;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
        access_log off;
    }

    location / {
        proxy_pass http://ai_toolkit;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CPU-only inference is slow: a 4x enhance on 2 OCPUs can run for
        # minutes. Defaults (60s) would cut those requests off as 504s.
        proxy_connect_timeout 15s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Stream the PNG straight through instead of spooling large enhancer
        # responses to disk first.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
